name: Publish legacy-entry migration page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:source
      - name: Require the new portal before switching this legacy entry
        run: |
          curl --fail --silent https://archimedas0612.github.io/ --output /tmp/portal.html
          grep --quiet '个人品牌门户' /tmp/portal.html
          grep --quiet 'portal-project' /tmp/portal.html
      - name: Prepare migration page and retain public image paths
        run: |
          mkdir -p dist/client
          cp -R public/. dist/client/
          cp hosting/legacy-entry.html dist/client/index.html
          touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Wait for artifact metadata visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")]|length')
            if [ "$COUNT" -gt 0 ]; then break; fi
            sleep 5
          done
          test "$COUNT" -gt 0
      - name: Deploy legacy migration
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public migration page
        run: |
          for attempt in {1..12}; do
            curl --fail --silent "https://archimedas0612.github.io/shenxinda-portfolio-website/?check=$GITHUB_RUN_ID" --output /tmp/legacy.html
            if grep --quiet '个人门户已迁移' /tmp/legacy.html; then break; fi
            sleep 5
          done
          grep --quiet '个人门户已迁移' /tmp/legacy.html
          grep --quiet 'url=https://archimedas0612.github.io/' /tmp/legacy.html
