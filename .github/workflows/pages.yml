name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:source
      - run: npm run build:pages
      - name: Place base-path assets at the GitHub Pages artifact root
        run: cp -R dist/client/shenxinda-portfolio-website/_next dist/client/_next
      - name: Render static homepage from the production build
        run: |
          GITHUB_PAGES=true npm start &
          SERVER_PID=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/shenxinda-portfolio-website/ --output dist/client/index.html; then
              break
            fi
            sleep 1
          done
          kill $SERVER_PID
          test -s dist/client/index.html
          touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public page and stylesheet
        run: |
          SITE_URL="https://archimedas0612.github.io/shenxinda-portfolio-website/"
          curl --fail --retry 6 --retry-delay 5 "$SITE_URL" --output /tmp/portfolio-page.html
          grep --quiet "沈鑫达" /tmp/portfolio-page.html
          CSS_PATH=$(grep -o 'href="[^"]*\.css"' /tmp/portfolio-page.html | head -1 | cut -d'"' -f2)
          test -n "$CSS_PATH"
          curl --fail --retry 6 --retry-delay 5 "https://archimedas0612.github.io$CSS_PATH" --output /tmp/portfolio-style.css
          test -s /tmp/portfolio-style.css
