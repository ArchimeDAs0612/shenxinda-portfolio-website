name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Place base-path assets at the GitHub Pages artifact root
        run: cp -R dist/client/shenxinda-portfolio-website/_next dist/client/_next
      - name: Render static homepage from the production build
        run: |
          GITHUB_PAGES=true npm start &
          SERVER_PID=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/shenxinda-portfolio-website/ --output dist/client/index.html; then
              break
            fi
            sleep 1
          done
          kill $SERVER_PID
          test -s dist/client/index.html
          touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
